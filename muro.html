<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muro de ladrillo</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<main class="contenedor">
<a class="volver" href="menu.html">← VOLVER AL MENÚ</a>

<form class="panel formulario" action="resultado-muro.html">
<h1>🧱 MURO DE LADRILLO</h1>

<label>Espesor del muro</label>
<div class="opciones">
<div class="opcion">20 CM</div>
<div class="opcion seleccionada">30 CM</div>
</div>

<label>Largo (m)</label>
<input type="number" step="0.01" placeholder="ej: 6.00" required>

<label>Alto (m)</label>
<input type="number" step="0.01" placeholder="ej: 2.80" required>

<div class="botones">
<button class="boton" type="submit">⚙ CALCULAR</button>
<button class="boton naranja" type="reset">✕ LIMPIAR</button>
</div>
</form>

<div class="pie">CONSTRUYE CON PRECISIÓN · CALCULA CON CONFIANZA</div>
</main>
</body>
</html>
